# Statistics-gathering documents (log_type orastats_gather, from
# elastic/filebeat/orastats-gather.yml) into the plain indices
# orastats-gather-<gs.record>: operation, task, stale, window, status.
#
# Lives next to elk_db_automation's oracle.conf in the same Logstash pipeline
# directory. Logstash concatenates every *.conf there in filename order, so the
# Beats input (mTLS, port 5044) and the common filters of oracle.conf run
# first; this file sorts after it ("orastats" > "oracle."), so the prune below
# sees and strips the event.* fields that pipeline adds. The index mapping is
# strict: anything the prune lets through must exist in
# elastic/elasticsearch/index-template.json.
filter {
  if [log_type] == "orastats_gather" {
    # The route survives the prune under @metadata, which prune never
    # touches and Elasticsearch never stores.
    mutate {
      add_field => { "[@metadata][orastats_route]" => "orastats_gather" }
      copy      => { "[host][name]" => "[@metadata][orastats_host]" }
    }
    prune {
      whitelist_names => ["^@timestamp$", "^gs$", "^labels$"]
    }
    if [@metadata][orastats_host] {
      mutate { add_field => { "[host][name]" => "%{[@metadata][orastats_host]}" } }
    }
    # Only the five known records get an index of their own.
    if [gs][record] not in ["operation", "task", "stale", "window", "status"] {
      mutate { replace => { "[@metadata][orastats_route]" => "drop" } }
    }
  }
}
output {
  if [@metadata][orastats_route] == "orastats_gather" {
    elasticsearch {
      hosts                       => ["${ES_HOSTS}"]
      user                        => "${ES_USER}"
      password                    => "${ES_PASSWORD}"
      index                       => "orastats-gather-%{[gs][record]}"
      document_id                 => "%{[@metadata][_id]}"
      action                      => "index"
      data_stream                 => false
      manage_template             => false
      ssl_enabled                 => "${ES_SSL_ENABLED:true}"
      ssl_certificate_authorities => ["${ES_CA}"]
    }
  }
}
